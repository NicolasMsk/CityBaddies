name: Daily scrape

# Scraping quotidien des 3 enseignes vers Supabase.
# Tous les scrapers sont en fetch + cheerio (aucun navigateur) -> job léger.
#
# ⚠️ Nocibé et Sephora sont derrière Akamai (blocage des UA desktop + rate-limit /
# réputation IP). Les scrapers utilisent un User-Agent mobile. Les IP datacenter
# de GitHub Actions PEUVENT être bloquées par Akamai même en UA mobile ; si un job
# ressort systématiquement à 0 produit importé (donc rouge), c'est le signal qu'il
# faut exécuter ce marchand depuis une IP résidentielle (voir documentation/SCRAPERS.md).

# ⚠️ CRON DÉSACTIVÉ (pivot comparateur, juillet 2026) : ce workflow importait les
# promos des pages catégories — y compris des produits HORS de la liste des
# parfums suivis, polluant le comparateur. Le site est désormais alimenté
# uniquement par "Track prices" (ScrapingQueue = liste de parfums vérifiée).
# Ce workflow reste déclenchable manuellement si besoin ponctuel.
on:
  workflow_dispatch:
    inputs:
      merchant:
        description: "Marchand à scraper (vide = les 3)"
        required: false
        default: ""
        type: choice
        options: ["", "nocibe", "marionnaud", "sephora"]

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        merchant: [nocibe, marionnaud, sephora]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Le filtre par marchand se fait au niveau des STEPS (le contexte `matrix`
      # n'est pas disponible dans un `if:` de job). Sur schedule, inputs.merchant
      # est absent -> la 1re condition (event != workflow_dispatch) laisse tout passer.
      - name: Scrape ${{ matrix.merchant }}
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.merchant == '' ||
          github.event.inputs.merchant == matrix.merchant
        run: npx tsx src/scripts/scrape.ts ${{ matrix.merchant }}

      # Enrichissement fiches produit (multi-images, description, INCI, conditions)
      # + IA (seoDescription, whyGoodDeal). Ne traite que les deals ACTIVE non enrichis.
      - name: Enrich ${{ matrix.merchant }}
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.merchant == '' ||
          github.event.inputs.merchant == matrix.merchant
        run: npx tsx src/scripts/enrich.ts ${{ matrix.merchant }} --limit 40
